# bootc-image-builder configuration: the account the console session uses.
# CHANGE THE PASSWORD before building an image you will install.
[[customizations.user]]
name = "player"
password = "change-me"
groups = ["wheel", "video", "audio", "input", "anypc"]

# Show the AnyPC boot splash instead of kernel messages.
[customizations.kernel]
append = "rhgb quiet"
